name: TheTranscriptor
options:
  bundleIdPrefix: com.allosa
  deploymentTarget:
    macOS: "14.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  TheTranscriptor:
    type: application
    platform: macOS
    sources:
      - path: TheTranscriptor
    info:
      path: TheTranscriptor/Info.plist
      properties:
        NSMicrophoneUsageDescription: "The Transcriptor usa el micrófono para grabar audio que se transcribe íntegramente en este Mac; nada se envía a internet."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allosa.TheTranscriptor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  TheTranscriptorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TheTranscriptorTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TheTranscriptor
schemes:
  TheTranscriptor:
    build:
      targets:
        TheTranscriptor: all
        TheTranscriptorTests: [test]
    test:
      targets:
        - TheTranscriptorTests
    run:
      config: Debug
